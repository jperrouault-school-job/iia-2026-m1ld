name: compose-node

services:
  web:
    build:
      context: .

    container_name: node-web
    ports:
      - 5000:80

    environment:
      DB_HOST: db
      DB_PASSWORD: root

    networks:
      - rso-node

  db:
    image: mysql:latest
    container_name: node-db

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demonode

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - rso-node

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1" ]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:latest
    container_name: node-flyway

    volumes:
      - ./migrations:/flyway/sql

    environment:
      FLYWAY_URL: jdbc:mysql://db:3306/demonode?allowPublicKeyRetrieval=true
      FLYWAY_USER: root
      FLYWAY_PASSWORD: root

    command:
      - migrate

    networks:
      - rso-node

    depends_on:
      db:
        condition: service_healthy

networks:
  rso-node:
    name: rso-node

volumes:
  mysql_data:

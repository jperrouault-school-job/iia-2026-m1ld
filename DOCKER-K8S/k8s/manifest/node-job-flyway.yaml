apiVersion: batch/v1
kind: Job

metadata:
  name: node-job-flyway

spec:
  template:
    spec:
      containers:
        - name: node-flyway
          image: registry:5000/node-flyway:v1

          envFrom:
            - secretRef:
                name: app-node-secret
            - configMapRef:
                name: app-node-config

          args:
            - -url=jdbc:mysql://db-node:3306/$(MYSQL_DATABASE)
            - -user=$(MYSQL_USERNAME)
            - -password=$(MYSQL_ROOT_PASSWORD)
            - migrate

      restartPolicy: Never

  backoffLimit: 3
